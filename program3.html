<!DOCTYPE html>
<html>
<head>
    <title>CSS Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>This is h2</h2>
    <h3>This is h3</h3>

    <hr>

    <p>This is a normal paragraph (element selector).</p>

    <div>
        This is a div.
        <p>This paragraph is inside a div (descendant selector).</p>
    </div>

    <div class="box">This div uses a class selector.</div>

    <p id="special">This paragraph uses an id selector.</p>

    <p>Today is <span>important</span> and the date is <time>20-11-2026</time></p>

    <img src="pic.jpg" alt="My picture">

    <br><br>
    <a href="https://www.google.com">Click here (hover on me)</a>

</body>
</html>

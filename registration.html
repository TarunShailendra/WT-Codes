<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body { background-color: lightcyan; }
        h2 { color: darkblue; font-size: 30px; text-align: center; }
        td { color: black; font-size: 18px; padding: 8px; }
        input, select, textarea { background-color: lightyellow; font-size: 16px; }
        input[type="submit"] { background-color: green; color: white; }
        input[type="reset"] { background-color: red; color: white; }
    </style>
</head>
<body>

    <h2>Registration Form</h2>

    <form>
        <table align="center" border="1">
            <tr>
                <td>Name</td>
                <td><input type="text" name="name"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="pass"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email"></td>
            </tr>
            <tr>
                <td>Age</td>
                <td><input type="number" name="age"></td>
            </tr>
            <tr>
                <td>Date of Birth</td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    <input type="checkbox"> Reading
                    <input type="checkbox"> Music
                </td>
            </tr>
            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option>CSE</option>
                        <option>ISE</option>
                        <option>ECE</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Address</td>
                <td><textarea rows="3" cols="20"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
